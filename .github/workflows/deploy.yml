name: Continuous Delivery & Deployment

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Deployment target environment (dry-run, staging, production)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - staging
          - production
      confirm_production:
        description: "Type 'DEPLOY_PRODUCTION' to confirm production rollout"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

# Prevent simultaneous deployments to target environments across any ref
concurrency:
  group: cd-deployment-production
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gates & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            scripts/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefix apps/api
          npm ci --prefix apps/web
          npm ci --prefix scripts

      - name: Lint API & Web
        run: |
          npm --prefix apps/api run lint
          npm --prefix apps/web run lint

      - name: Unit & Integration Tests (API)
        env:
          RUN_PG_TESTS: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
        run: npm --prefix apps/api test

      - name: Unit & Component Tests (Web)
        run: npm --prefix apps/web test

      - name: Build API & Web Artifacts
        run: |
          npm --prefix apps/api run build
          npm --prefix apps/web run build

      - name: Install Playwright Browsers
        run: node scripts/node_modules/playwright/cli.js install --with-deps chromium --only-shell

      - name: Deployment Tooling Verification Suite
        run: node scripts/test-deployment-scripts.mjs

      - name: Compose & E2E Acceptance Test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          node scripts/test-compose.mjs 2>&1 | tee test-results/acceptance.log

      - name: Upload Quality Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-quality-evidence
          path: test-results/
          retention-days: 14

  build-and-push:
    name: Build & Publish Docker Images to GHCR
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
      api_digest: ${{ steps.build-api.outputs.digest }}
      web_digest: ${{ steps.build-web.outputs.digest }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: meta
        shell: bash
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ github.sha }}"
          API_IMAGE="ghcr.io/${REPO_OWNER}/brewlite-api"
          WEB_IMAGE="ghcr.io/${REPO_OWNER}/brewlite-web"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "api_image=${API_IMAGE}" >> $GITHUB_OUTPUT
          echo "web_image=${WEB_IMAGE}" >> $GITHUB_OUTPUT
          echo "API Image: ${API_IMAGE}:${IMAGE_TAG}"
          echo "Web Image: ${WEB_IMAGE}:${IMAGE_TAG}"

      - name: Build & Push API Image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.api_image }}:latest
          provenance: false

      - name: Build & Push Web Image
        id: build-web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          target: runner
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.web_image }}:latest
          provenance: false

      - name: Summary of Published Images
        shell: bash
        run: |
          echo "### 🐳 GHCR Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **API** | \`${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}\` | \`${{ steps.build-api.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web** | \`${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}\` | \`${{ steps.build-web.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # Isolated Dry-Run Job (Zero SSH connection, purely simulates and validates)
  deploy-dry-run:
    name: Dry-Run Deployment Simulation
    needs: [quality-gate, build-and-push]
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Production Compose Syntax
        run: |
          echo "Validating docker-compose.prod.yml..."
          API_IMAGE_REF="${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.image_tag }}" \
          WEB_IMAGE_REF="${{ needs.build-and-push.outputs.web_image }}:${{ needs.build-and-push.outputs.image_tag }}" \
          docker compose -f docker-compose.prod.yml config -q
          echo "✔ Compose configuration syntax is valid (zero secrets dumped)."

      - name: Run Deployment & Rollback Simulation Test
        run: node scripts/test-deployment-scripts.mjs

      - name: Record Dry-run Summary
        run: |
          echo "### 🧪 Dry-Run Deployment Audit" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** DRY-RUN (Isolated Simulation)" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** All compose descriptors, fail-closed backups, and rollback invariants verified successfully." >> $GITHUB_STEP_SUMMARY
          echo "**Zero Remote Calls:** No remote SSH connection was initiated." >> $GITHUB_STEP_SUMMARY

  # Staging Deployment Job (Explicitly reports status if staging is selected - FIX-10)
  deploy-staging:
    name: Deploy to Staging Environment
    needs: [quality-gate, build-and-push]
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Report Staging Status
        run: |
          echo "### ⚠️ Staging Deployment Audit (FIX-10)" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** BLOCKED / NOT CONFIGURED" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** Staging cloud instance is not provisioned in this milestone (ADR-007 defines single-VM production topology)." >> $GITHUB_STEP_SUMMARY
          echo "**Safety:** No deployment was performed to avoid false claims of staging readiness." >> $GITHUB_STEP_SUMMARY

  # Production Deployment Job (Requires Intentional Approval Gate & Manual Trigger - FIX-10, FIX-14, FIX-16)
  deploy-production:
    name: Deploy to Production (AWS Lightsail)
    needs: [quality-gate, build-and-push]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target_env == 'production' &&
      inputs.confirm_production == 'DEPLOY_PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://${{ vars.DOMAIN || 'brewlite.vn' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Production Host Prerequisites & Required Secrets (FIX-07, FIX-08, FIX-14, FIX-15, FIX-16)
        id: check-prereqs
        shell: bash
        env:
          INPUT_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          INPUT_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          INPUT_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          INPUT_PG_DB: ${{ secrets.POSTGRES_DB }}
          INPUT_PG_USER: ${{ secrets.POSTGRES_USER }}
          INPUT_PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          INPUT_JWT_SEC: ${{ secrets.JWT_SECRET }}
          INPUT_DOMAIN: ${{ vars.DOMAIN }}
          INPUT_CADDY_HOSTS: ${{ vars.CADDY_HOSTS }}
          INPUT_APPROVAL_CONF: ${{ vars.PRODUCTION_APPROVAL_CONFIGURED }}
        run: |
          set -eo pipefail
          echo "=== Verifying AWS Lightsail Production Host Configuration & Required Secrets ==="
          HAS_HOST=true
          MISSING_SECRETS=""

          check_var() {
            local val="$1"
            local name="$2"
            if [ -z "$val" ]; then
              HAS_HOST=false
              MISSING_SECRETS="$MISSING_SECRETS $name"
              echo "❌ Missing mandatory secret/variable: $name"
            else
              echo "✔ $name is provisioned."
            fi
          }

          check_var "$INPUT_SSH_KEY" "LIGHTSAIL_SSH_KEY"
          check_var "$INPUT_HOST" "LIGHTSAIL_HOST"
          check_var "$INPUT_KNOWN_HOSTS" "LIGHTSAIL_SSH_KNOWN_HOSTS"
          check_var "$INPUT_PG_DB" "POSTGRES_DB"
          check_var "$INPUT_PG_USER" "POSTGRES_USER"
          check_var "$INPUT_PG_PASS" "POSTGRES_PASSWORD"
          check_var "$INPUT_JWT_SEC" "JWT_SECRET"
          check_var "$INPUT_DOMAIN" "DOMAIN (variable)"
          check_var "$INPUT_CADDY_HOSTS" "CADDY_HOSTS (variable)"

          # FIX-5.4.1: Enforce that DOMAIN is a single hostname, not a comma list or URL
          if [ -n "$INPUT_DOMAIN" ]; then
            if [[ "$INPUT_DOMAIN" =~ [,\ ] ]] || [[ "$INPUT_DOMAIN" =~ ^https?:// ]]; then
              HAS_HOST=false
              MISSING_SECRETS="$MISSING_SECRETS DOMAIN_FORMAT_INVALID"
              echo "❌ DOMAIN must be a single hostname without commas, whitespace, or scheme (e.g. 'brewlite.54-255-241-1.sslip.io'). Use CADDY_HOSTS for multiple hostnames."
            fi
          fi

          # FIX-01: Validate CADDY_HOSTS is provided, valid, and contains primary DOMAIN
          if [ -n "$INPUT_CADDY_HOSTS" ]; then
            if [[ "$INPUT_CADDY_HOSTS" =~ https?:// ]]; then
              HAS_HOST=false
              MISSING_SECRETS="$MISSING_SECRETS CADDY_HOSTS_INVALID_SCHEME"
              echo "❌ CADDY_HOSTS must not contain 'http://' or 'https://'. Provide hostnames separated by commas or spaces."
            fi

            if [ -n "$INPUT_DOMAIN" ]; then
              if ! echo "$INPUT_CADDY_HOSTS" | grep -qw "$INPUT_DOMAIN"; then
                HAS_HOST=false
                MISSING_SECRETS="$MISSING_SECRETS CADDY_HOSTS_MISSING_PRIMARY_DOMAIN"
                echo "❌ CADDY_HOSTS ('$INPUT_CADDY_HOSTS') must contain primary DOMAIN ('$INPUT_DOMAIN')."
              fi
            fi
          fi

          # FIX-14 & FIX-16: Verification of explicit approval gate configuration
          if [ "$INPUT_APPROVAL_CONF" != "true" ]; then
            HAS_HOST=false
            MISSING_SECRETS="$MISSING_SECRETS PRODUCTION_APPROVAL_CONFIGURED"
            echo "❌ PRODUCTION_APPROVAL_CONFIGURED is not 'true'. Refusing deployment without verified approval gate."
          else
            echo "✔ Production administrative confirmation verified (PRODUCTION_APPROVAL_CONFIGURED=true)."
            echo "ℹ️ Note: Platform enforcement is guaranteed by GitHub Environment 'production' Required Reviewers policy."
          fi

          if [ "$HAS_HOST" = "true" ]; then
            echo "has_host=true" >> $GITHUB_OUTPUT
            echo "✔ All production prerequisites, secrets, and known_hosts fingerprints verified."
          else
            echo "has_host=false" >> $GITHUB_OUTPUT
            echo "⚠️ Production deployment is BLOCKED due to missing required configuration:$MISSING_SECRETS"
            echo "Deployment step safely running in BLOCKED / SIMULATION mode (Zero remote calls)."
          fi

      - name: Validate Production Compose Descriptors
        run: |
          API_IMAGE_REF="${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.image_tag }}" \
          WEB_IMAGE_REF="${{ needs.build-and-push.outputs.web_image }}:${{ needs.build-and-push.outputs.image_tag }}" \
          docker compose -f docker-compose.prod.yml config -q
          echo "✔ Compose configuration syntax is valid (zero secrets dumped)."

      - name: Hardened Remote Deployment Execution (FIX-07 to FIX-16)
        if: steps.check-prereqs.outputs.has_host == 'true'
        id: remote-deploy
        shell: bash
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          PG_DB: ${{ secrets.POSTGRES_DB }}
          PG_USER: ${{ secrets.POSTGRES_USER }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SEC: ${{ secrets.JWT_SECRET }}
          API_IMAGE_REF: ${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.image_tag }}
          WEB_IMAGE_REF: ${{ needs.build-and-push.outputs.web_image }}:${{ needs.build-and-push.outputs.image_tag }}
          DOMAIN: ${{ vars.DOMAIN }}
          CADDY_HOSTS: ${{ vars.CADDY_HOSTS }}
        run: |
          set -eo pipefail

          # FIX-07: Setup SSH strictly using trusted LIGHTSAIL_SSH_KNOWN_HOSTS (No unverified keyscan)
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa

          if [ -z "$KNOWN_HOSTS" ]; then
            echo "❌ FATAL: LIGHTSAIL_SSH_KNOWN_HOSTS is empty or not provided. Refusing SSH without verified fingerprint."
            exit 1
          fi

          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          echo "✔ Host fingerprint verified from trusted LIGHTSAIL_SSH_KNOWN_HOSTS."

          SSH_CMD="ssh -o StrictHostKeyChecking=yes -o BatchMode=yes"
          SCP_CMD="scp -o StrictHostKeyChecking=yes -o BatchMode=yes"

          echo "1. Checking remote prerequisites (Docker, Compose, Node.js)..."
          $SSH_CMD "$SSH_USER@$HOST" "bash -s" << 'EOF'
            set -eo pipefail
            docker --version > /dev/null 2>&1 || { echo "❌ Docker Engine not found on host!"; exit 1; }
            docker compose version > /dev/null 2>&1 || { echo "❌ Docker Compose not found on host!"; exit 1; }
            node --version > /dev/null 2>&1 || { echo "❌ Node.js not found on host!"; exit 1; }
            mkdir -p /home/$USER/app && chmod 700 /home/$USER/app
          EOF

          echo "2. Provisioning environment secrets securely to host (FIX-15 & FIX-16: safe serialization via safe-env.mjs)..."
          node -e '
            import("./scripts/safe-env.mjs").then(({ serializeEnv }) => {
              const content = serializeEnv({
                POSTGRES_DB: process.env.PG_DB,
                POSTGRES_USER: process.env.PG_USER,
                POSTGRES_PASSWORD: process.env.PG_PASS,
                JWT_SECRET: process.env.JWT_SEC,
                DOMAIN: process.env.DOMAIN,
                CADDY_HOSTS: process.env.CADDY_HOSTS,
                API_IMAGE_REF: process.env.API_IMAGE_REF,
                WEB_IMAGE_REF: process.env.WEB_IMAGE_REF,
                NODE_ENV: "production"
              });
              process.stdout.write(Buffer.from(content, "utf8").toString("base64"));
            }).catch(err => {
              console.error("❌ Failed to serialize production environment:", err.message);
              process.exit(1);
            });
          ' | $SSH_CMD "$SSH_USER@$HOST" '
            set -eo pipefail
            APP_DIR="/home/$USER/app"
            mkdir -p "$APP_DIR" && chmod 700 "$APP_DIR"
            TMP_ENV="$APP_DIR/.env.tmp.$$"
            trap "rm -f \"\$TMP_ENV\"" EXIT INT TERM
            umask 077
            base64 -d > "$TMP_ENV"
            chmod 600 "$TMP_ENV"
            mv -f "$TMP_ENV" "$APP_DIR/.env"
            trap - EXIT INT TERM
          '

          echo "3. Syncing deployment descriptors to host..."
          $SCP_CMD -r docker-compose.prod.yml Caddyfile scripts "$SSH_USER@$HOST:/home/$SSH_USER/app/"

          echo "4. Executing transactional deployment pipeline on remote host (FIX-08, FIX-09, FIX-13, FIX-16)..."
          $SSH_CMD "$SSH_USER@$HOST" "bash -s" << 'EOF'
            set -eo pipefail
            cd /home/$USER/app

            # FIX-16: Safely extract essential variables without sourcing .env
            if [ ! -f .env ]; then
              echo "❌ FATAL: .env file missing in /home/$USER/app"
              exit 1
            fi

            # Validate mandatory production variables exist in .env
            node scripts/safe-env.mjs validate .env DOMAIN CADDY_HOSTS POSTGRES_USER POSTGRES_DB POSTGRES_PASSWORD JWT_SECRET

            # Safely extract variables needed for container readiness check and smoke test
            DOMAIN=$(node scripts/safe-env.mjs get .env DOMAIN)
            POSTGRES_USER=$(node scripts/safe-env.mjs get .env POSTGRES_USER)
            POSTGRES_DB=$(node scripts/safe-env.mjs get .env POSTGRES_DB)
            export DOMAIN POSTGRES_USER POSTGRES_DB

            # A. Record current deployment state (FIX-09: never ignore errors with || true)
            node scripts/deployment-state.mjs

            # B. FIX-08: Ensure PostgreSQL container is running & ready before backup/migration
            docker compose -f docker-compose.prod.yml up -d db

            echo "Waiting for database container to report ready..."
            DB_READY=false
            for i in {1..30}; do
              CONTAINER_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' brewlite-prod-db 2>/dev/null || echo "not_found")
              if [ "$CONTAINER_HEALTH" = "healthy" ]; then
                DB_READY=true
                echo "✔ Database container reported healthy."
                break
              fi
              if docker exec brewlite-prod-db pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                DB_READY=true
                echo "✔ Database is responsive via pg_isready."
                break
              fi
              sleep 1
            done

            if [ "$DB_READY" != "true" ]; then
              echo "❌ Database failed to become ready within timeout!"
              node scripts/rollback.mjs
              exit 1
            fi

            # C. Fail-closed pre-deployment backup (FIX-01, FIX-08, FIX-12)
            node scripts/backup-db.mjs

            # D. Pull target images from GHCR (with rollback on failure)
            if ! docker compose -f docker-compose.prod.yml pull; then
              echo "❌ Image pull failed! Triggering safe rollback..."
              node scripts/rollback.mjs
              exit 1
            fi

            # E. Safe schema migration (with rollback on failure)
            if ! docker compose -f docker-compose.prod.yml run --rm --no-deps api node dist/prepare-database.js migrate; then
              echo "❌ Schema migration failed! Triggering safe rollback..."
              node scripts/rollback.mjs
              exit 1
            fi

            # F. Rolling container update (with rollback on failure)
            if ! docker compose -f docker-compose.prod.yml up -d --remove-orphans; then
              echo "❌ Container update failed! Triggering safe rollback..."
              node scripts/rollback.mjs
              exit 1
            fi

            # G. Production Smoke Test with real configured DOMAIN (FIX-13)
            echo "Running smoke test against configured domain: https://$DOMAIN"
            if ! TARGET_ENV=production TARGET_URL="https://$DOMAIN" node scripts/smoke-test.mjs; then
              echo "❌ Smoke test failed against https://$DOMAIN! Triggering automatic safe rollback..."
              node scripts/rollback.mjs
              exit 1
            fi
          EOF
          echo "deployed_real=true" >> $GITHUB_OUTPUT

      - name: Record Deployment State & Audit Summary
        shell: bash
        env:
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          DEPLOYED_REAL: ${{ steps.remote-deploy.outputs.deployed_real }}
        run: |
          echo "### 🚀 Production Deployment Audit" >> $GITHUB_STEP_SUMMARY
          if [ "$DEPLOYED_REAL" = "true" ]; then
            echo "**Status:** VERIFIED IN PRODUCTION" >> $GITHUB_STEP_SUMMARY
            echo "**Target Host:** \`$HOST\`" >> $GITHUB_STEP_SUMMARY
            echo "**Verification:** Smoke test passed 100% via HTTPS." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** BLOCKED / DRY-RUN (Pending AWS Lightsail VM SSH credentials & live environment)" >> $GITHUB_STEP_SUMMARY
            echo "**Image Artifacts Verified:** GHCR Docker images built and published successfully." >> $GITHUB_STEP_SUMMARY
            echo "**Safety:** No real production secrets leaked, schema migrations validated without destructive changes." >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Component | Target Image Ref |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| API | \`${{ needs.build-and-push.outputs.api_image }}:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Web | \`${{ needs.build-and-push.outputs.web_image }}:${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
