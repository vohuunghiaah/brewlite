name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    name: Security & Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks 8.24.3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Verify detection with a synthetic fixture
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          printf 'token = "ghp_%s"\n' "$(printf brewlite-synthetic-scanner-control | sha256sum | cut -c1-36)" > "$fixture/sample.txt"
          rc=0
          "$RUNNER_TEMP/gitleaks" dir "$fixture" --config=.gitleaks.toml --redact=100 --exit-code=17 --report-path="$RUNNER_TEMP/control.json" || rc=$?
          test "$rc" = 17
          jq -e 'any(.[]; .RuleID == "github-pat")' "$RUNNER_TEMP/control.json" >/dev/null

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config=.gitleaks.toml --redact=100 --log-opts="$BASE_SHA..$HEAD_SHA --full-history --diff-merges=first-parent"

      - name: Scan fetched branches, tags and merge changes
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          git rev-list --all --count
          "$RUNNER_TEMP/gitleaks" git . --config=.gitleaks.toml --redact=100 --log-opts="--all --full-history --diff-merges=first-parent"

  quality:
    name: ${{ matrix.app }} lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit & Integration Tests
        run: npm test
        env:
          RUN_PG_TESTS: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
      - name: Mandatory Catalog Sync & Rollback Integration Tests
        if: matrix.app == 'api'
        run: node ../../scripts/test-sync-catalog.mjs
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USER: brewlite
          DATABASE_PASSWORD: brewlite_dev_password
          DATABASE_NAME: brewlite_test
          REQUIRE_DB: 'true'
          CI: 'true'
      - name: Build
        run: npm run build

  acceptance:
    name: Compose, Chromium and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts
      - run: node scripts/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Production rollout regression
        run: bash scripts/test-production-rollout.sh
      - name: Rebuild database and run acceptance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          node scripts/test-deployment-scripts.mjs
          node scripts/test-compose.mjs 2>&1 | tee test-results/acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-5-2-acceptance
          path: test-results/
          retention-days: 14
