name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    name: Security & Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run Gitleaks Scanner (PR Commit Scope)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Full Repository Git History Audit (All Commits)
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect --source="/path" --config="/path/.gitleaks.toml" --verbose --redact

  quality:
    name: ${{ matrix.app }} lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit & Integration Tests
        run: npm test
        env:
          RUN_PG_TESTS: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
      - name: Mandatory Catalog Sync & Rollback Integration Tests
        if: matrix.app == 'api'
        run: node ../../scripts/test-sync-catalog.mjs
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite_dev_password
          POSTGRES_DB: brewlite_test
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
          DATABASE_USER: brewlite
          DATABASE_PASSWORD: brewlite_dev_password
          DATABASE_NAME: brewlite_test
          REQUIRE_DB: 'true'
          CI: 'true'
      - name: Build
        run: npm run build

  acceptance:
    name: Compose, Chromium and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts
      - run: node scripts/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Production rollout regression
        run: bash scripts/test-production-rollout.sh
      - name: Rebuild database and run acceptance
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          node scripts/test-deployment-scripts.mjs
          node scripts/test-compose.mjs 2>&1 | tee test-results/acceptance.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-5-2-acceptance
          path: test-results/
          retention-days: 14
