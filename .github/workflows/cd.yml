name: CD Production Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target Environment (production / staging)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Job 1: Build & Publish Container Images
  # ==========================================
  build-and-push:
    name: Build & Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Real Production Deployment & Verification
  # ==========================================
  deploy:
    name: Deploy & Verify Health Smoke Test
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Deployment Configuration
        run: |
          echo "=========================================================="
          echo "Kiểm tra cấu hình triển khai Production (Commit: ${{ github.sha }})"
          echo "Môi trường mục tiêu: ${{ inputs.deploy_env || 'production' }}"
          echo "=========================================================="
          
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "::error::Bí mật DEPLOY_WEBHOOK_URL chưa được cấu hình trên GitHub Repository."
            echo "Triển khai tự động dừng lại để bảo đảm an toàn. Không giả lập trạng thái thành công."
            exit 1
          fi

      - name: Trigger Real Deployment
        id: deploy_trigger
        run: |
          echo "Gửi tín hiệu triển khai tới Production Webhook..."
          HTTP_CODE=$(curl -s -o /tmp/deploy_res.txt -w "%{http_code}" -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}")
          echo "HTTP Response Code: $HTTP_CODE"
          cat /tmp/deploy_res.txt || true
          
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Gọi Webhook triển khai thất bại với HTTP code $HTTP_CODE"
            exit 1
          fi
          echo "Tín hiệu triển khai đã được tiếp nhận thành công."

      - name: Post-Deploy Health Check & Smoke Test
        run: |
          TARGET_URL="${{ vars.PRODUCTION_API_URL || secrets.PRODUCTION_API_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "::error::PRODUCTION_API_URL chưa được cấu hình. Không thể xác minh dịch vụ thực tế."
            exit 1
          fi
          
          echo "Tiến hành Smoke Test kiểm tra endpoint thực tế tại: $TARGET_URL/api/health"
          ATTEMPTS=0
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=10
          
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            echo "[$ATTEMPTS/$MAX_ATTEMPTS] Đang gửi yêu cầu GET $TARGET_URL/api/health..."
            
            HTTP_STATUS=$(curl -s -o /tmp/health_res.json -w "%{http_code}" --max-time 10 "$TARGET_URL/api/health" || echo "000")
            
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "Nhận HTTP 200 từ dịch vụ Production."
              cat /tmp/health_res.json
              echo ""
              
              # Xác thực nội dung JSON phản hồi chứa status ok
              if grep -q '"status":"ok"' /tmp/health_res.json; then
                echo "XÁC NHẬN: Health check phản hồi hợp lệ (status: ok). Smoke test PASS."
                exit 0
              fi
            fi
            
            echo "Dịch vụ chưa sẵn sàng (HTTP: $HTTP_STATUS). Đợi $SLEEP_SECONDS giây..."
            sleep $SLEEP_SECONDS
          done
          
          echo "::error::Quá thời gian chờ (Timeout): Dịch vụ production không phản hồi HTTP 200 sau $MAX_ATTEMPTS lần thử."
          cat /tmp/health_res.json 2>/dev/null || true
          exit 1

      - name: Rollback Notification on Failure
        if: failure()
        run: |
          echo "::error::CRITICAL: Quá trình triển khai hoặc kiểm thử Production thất bại!"
          echo "Quy trình an toàn: Không chuyển hướng lưu lượng truy cập sang bản build mới lỗi."
          if [ -n "${{ secrets.ROLLBACK_WEBHOOK_URL }}" ]; then
            echo "Kích hoạt Rollback Webhook..."
            curl -s -X POST "${{ secrets.ROLLBACK_WEBHOOK_URL }}" || true
          fi
