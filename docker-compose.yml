services:
  # =========================
  # PostgreSQL Database
  # =========================
  db:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - brewlite-network

  # =========================
  # NestJS Backend
  # =========================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: brewlite-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: http://localhost:3000

    ports:
      - "${API_PORT:-3001}:3001"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./apps/api:/app
      - /app/node_modules

    command: npm run start:dev

    networks:
      - brewlite-network

  # =========================
  # Next.js Frontend
  # =========================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: brewlite-web
    restart: unless-stopped

    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}

    ports:
      - "${WEB_PORT:-3000}:3000"

    depends_on:
      - api

    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

    command: npm run dev -- --hostname 0.0.0.0

    networks:
      - brewlite-network

# =========================
# Persistent Storage
# =========================
volumes:
  postgres_data:

# =========================
# Docker Network
# =========================
networks:
  brewlite-network:
    driver: bridge
