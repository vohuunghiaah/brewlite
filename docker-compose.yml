services:
  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER:-brewlite-db}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - brewlite-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile

    container_name: ${API_CONTAINER:-brewlite-api}
    restart: unless-stopped

    env_file:
      - ${BREWLITE_ENV_FILE:-.env}

    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 4s
      retries: 20

    ports:
      - "${API_PORT:-3001}:3001"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./apps/api:/app
      - /app/node_modules

    command: npm run start:dev

    networks:
      - brewlite-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile

    container_name: ${WEB_CONTAINER:-brewlite-web}
    restart: unless-stopped

    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}

    ports:
      - "${WEB_PORT:-3000}:3000"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/menu').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20

    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

    command: npm run dev -- --hostname 0.0.0.0

    networks:
      - brewlite-network

volumes:
  postgres_data:

networks:
  brewlite-network:
    driver: bridge